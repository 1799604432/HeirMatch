[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heritage-herimatch-core"
version = "0.1.0"
description = "Core algorithms for MegaLoc-HSPA and multilevel heritage image graph matching"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<2",
    "torch>=2.1",
    "torchvision>=0.16",
    "Pillow>=9",
    "huggingface-hub>=0.20",
    "safetensors>=0.4",
]

[tool.setuptools.packages.find]
include = ["herimatch*"]

[tool.setuptools.package-data]
"herimatch._vendor.megaloc" = ["LICENSE"]
